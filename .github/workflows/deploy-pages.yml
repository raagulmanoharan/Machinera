name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/repo-cleanup-r2j0sm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent run per branch. Scoping the group by ref keeps a feature
# branch's validation build from cancelling an in-progress main deployment
# (which shared a single "pages" group before and left main un-deployed).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # GitHub Pages can only deploy from the default branch; build still runs
    # on feature branches to validate, but we skip the deploy there.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
