<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Machinera — City</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #000; color: #eef2f7; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      canvas { display: block; }
      #cityLoader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 50% 30%, #0b1017, #05070a); z-index: 20;
        letter-spacing: 0.25em; font-size: 13px; text-transform: uppercase; color: #9fb3c8;
      }
      #cityUI {
        position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 15; display: flex; align-items: center; gap: 14px;
        background: rgba(14, 18, 24, 0.6); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(8px);
      }
      #cityUI label { font-size: 11px; letter-spacing: 0.12em; color: #9fb3c8; text-transform: uppercase; }
      #hour { width: 160px; accent-color: #57e0c8; }
      #cityBack { color: #57e0c8; text-decoration: none; font-size: 13px; font-weight: 600; }
      #cityBack:hover { text-decoration: underline; }
      #cityErr {
        position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 30; max-width: 90vw;
        background: rgba(20, 12, 12, 0.9); border: 1px solid #ff6b6b; color: #ffd9d9;
        padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none;
      }
    </style>
  </head>
  <body>
    <div id="cityLoader">Loading the city…</div>
    <div id="cityErr"></div>
    <div id="cityUI">
      <label for="hour">Hour</label>
      <input id="hour" type="range" min="0" max="24" step="0.1" value="3" />
      <a id="cityBack" href="./index.html">← drive</a>
    </div>
    <script type="module" src="/src/city/main.js"></script>
  </body>
</html>
