<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Machinera Drive</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- Loading overlay -->
      <div id="loader" class="overlay">
        <div class="loader-inner">
          <div class="mark">MACHINERA<span>DRIVE</span></div>
          <div class="bar"><i></i></div>
          <div class="hint">Preparing the road…</div>
        </div>
      </div>

      <!-- Touch driving controls (shown on touch devices) -->
      <div id="touch" aria-hidden="true">
        <button id="brakeBtn" class="tbtn brake" aria-label="Brake">❚❚</button>
        <button id="accelBtn" class="tbtn accel" aria-label="Accelerate">▲</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
