<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191b1e"><title>Strand</title><link rel="stylesheet" href="style.css?v=9"><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script></head><body><main id="stage" aria-label="Strand camera. Tap the camera to open its live view. Tap again to weave. Hold to choose a photo. Touch and drag the attached fabric to tug it. Pinch to look closer."><video id="camera" autoplay playsinline muted hidden></video><input id="file" type="file" accept="image/*" hidden><section id="viewfinder" hidden aria-label="Optical viewfinder"><div class="finder-housing"><div class="finder-top"><span class="engraving">STRAND · MEMORY OPTICS</span><button id="finderClose" aria-label="Close viewfinder">↙</button></div><div class="glass"><canvas id="opticalFeed" aria-label="Live feed with lens effects"></canvas><div class="glass-patina"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div id="focusMark"></div><div class="glass-meta"><span id="lensReadout">HELIOS / 58 mm</span><span>◉ LIVE</span></div></div><div class="lcd"><span><i></i> OPTICAL MEMORY</span><strong id="settingsReadout">58 mm · f/2.0 · ISO 400</strong></div><div class="lens-switch" aria-label="Lens character"><button class="selected" data-lens="0"><span class="mini-lens swirl"></span>Helios</button><button data-lens="1"><span class="mini-lens anamorph"></span>Anamorph</button><button data-lens="2"><span class="mini-lens prism"></span>Prism</button><button id="dither" aria-pressed="false"><span class="mini-lens dots"></span>Dither</button></div><div class="wheel-controls"><label><span>FOCUS <output id="focusValue">0.55</output></span><input type="range" id="focusDial" min="0" max="100" value="55" aria-label="Defocus amount"></label><label><span>IRIS <output id="irisValue">f/2.0</output></span><input type="range" id="irisDial" min="0" max="100" value="12" aria-label="Aperture"></label><label><span>GRAIN <output id="grainValue">400</output></span><input type="range" id="grainDial" min="0" max="100" value="30" aria-label="Film grain"></label></div><div class="finder-bottom"><button id="finderUpload" class="metal-key" aria-label="Choose a photo">▧</button><div class="shutter-base"><button id="finderShutter" aria-label="Capture this optical image and weave"><span></span></button><span class="engraving">WEAVE THIS MOMENT</span></div><button id="finderFlip" class="metal-key" aria-label="Switch camera">⇄</button></div></div></section><nav id="fabricTools" hidden aria-label="Inspect your fabric"><div class="weave-choices"><select id="weaveType" aria-label="Weave structure"><option value="plain">Plain</option><option value="basket">Basket</option><option value="twill">Twill</option><option value="chevron">Chevron</option><option value="satin">Satin</option></select><select id="weaveMaterial" aria-label="Strand material and colour"><option value="yarn">Spun yarn</option><option value="ribbon">Ribbons</option><option value="cotton">Photo cotton</option></select></div><button id="zoomOut" aria-label="Zoom out">−</button><button id="fitFabric" aria-label="Fit whole fabric">⤢</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="saveFabric" aria-label="Save high-resolution fabric">↓</button></nav><div id="flash" aria-hidden="true"></div><p id="notice" role="status" hidden></p><button id="accessibleCapture" class="sr-only">Open camera or capture a weave</button><button id="accessibleUpload" class="sr-only">Choose a photo</button><button id="accessibleDemo" class="sr-only">Weave a sample</button><button id="accessibleSave" class="sr-only">Save woven cloth</button><button id="accessibleReset" class="sr-only">Begin again</button></main><script type="module" src="app.js?v=9"></script></body></html>
